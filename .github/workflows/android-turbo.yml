name: android-turbo
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -mtune=cortex-a73" \
            -DCMAKE_CXX_FLAGS="-O3 -mtune=cortex-a73" \
            -DGGML_CPU_ARM_ARCH=armv8-a \
            -DGGML_NATIVE=OFF -DGGML_LTO=ON \
            -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF
          cmake --build build -j4 --target llama-cli llama-server llama-bench
      - uses: actions/upload-artifact@v4
        with:
          name: llama-android
          path: build/bin/llama-*
